<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{TITLE}}</title>
  {{HEAD}}
</head>
<body data-brand="{{BRAND_NAME}}" data-app="{{APP_NAME}}" data-business="{{BUSINESS_NAME}}">
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      {{LOGO}}
      <nav class="nav" aria-label="Main">
        <a href="#reviews" data-view="reviews">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H11l-4 3v-3H4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
          Reviews <span class="count hidden" id="nav-pending"></span>
        </a>
        <a href="#analytics" data-view="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Analytics
        </a>
        <a href="#settings" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          Settings
        </a>
        <a href="#account" data-view="account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
          Team &amp; security
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="who"><div class="avatar" id="me-avatar"></div><span class="email" id="me-email"></span></div>
        <button class="btn sm" id="logout-btn" type="button">Sign out</button>
      </div>
    </aside>
    <div>
      <header class="topbar">
        <button class="btn ghost sm" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        {{LOGO}}
      </header>
      <main class="main" id="main" tabindex="-1">
        <div id="banners"></div>
        <div id="view"></div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip hidden" id="tooltip" role="tooltip"></div>
  <script src="/assets/charts.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
